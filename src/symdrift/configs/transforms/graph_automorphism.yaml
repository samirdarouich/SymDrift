# Define transforms to apply when loading data

# Filter conformers based on their Boltzmann weight, keeping only the top n conformers per graph.
subselect_top_k_conformers:
  _target_: symdrift.datasets.BoltzmannWeightingConformers
  keep_top_n: 30

# Gather all permutations allowed by graph automorphisms.
# If "ignore_hs" is true, hydrogens will be ignored for graph automorphisms. 
# If "use_atom_features" is true these will be considered addiitonally to 
# define the graph automorphisms (reduces number of interchangeable atoms)
# This also defines orbit_ids which assigns each upper triangular pair interaction 
# to an orbit. Interactions in the same orbit are interchangeable in the invariant 
# embedding. Saving the automorphisms can take a lot of memory, so this can be turned
# on only if the actual automorphisms should be used (for example to find the right 
# alignment in coordinate space). If only the orbit_ids are needed for the invariant 
# embedding, the automorphisms do not need to be saved. Use at max 10_000 automorphisms
# to avoid combinatorial explosion for large molecules.
# cache_size bounds the per-worker, per-SMILES orbit-id cache (LRU eviction,
# oldest molecule evicted once the cache holds more than cache_size entries).
# Runtime transforms live inside persistent DataLoader workers for the whole
# job, and each of the (num_workers * devices) worker processes keeps its own
# copy of this cache, so total memory scales with that worker count. Set well
# above the number of unique molecules a single worker will ever see (here:
# comfortably above the training set size) so nothing gets evicted and the
# expensive automorphism enumeration is never recomputed; train_geom_drugs.sh
# requests enough --mem to cover this at full cache occupancy.
generate_orbit_ids:
  _target_: symdrift.datasets.transforms.OrbitIds
  smiles_key: smiles
  orbit_type: automorphism
  ignore_hs: false
  use_atom_features: true
  max_automorphisms: 10_000
  save_automorphisms: false
  cache_size: 300_000

# creates additional batch mask for each conformer. 
follow_batch: [x_conf, automorphisms]
exclude_keys: null

train_transform:
  _target_: torch_geometric.transforms.Compose
  transforms:
    - ${dataset.transforms.subselect_top_k_conformers}
    - ${dataset.transforms.generate_orbit_ids}

val_transform:
  _target_: torch_geometric.transforms.Compose
  transforms:
    - ${dataset.transforms.subselect_top_k_conformers}
    - ${dataset.transforms.generate_orbit_ids}

test_transform:
  _target_: torch_geometric.transforms.Compose
  transforms:
    - ${dataset.transforms.generate_orbit_ids}