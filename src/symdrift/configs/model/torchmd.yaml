defaults:
  - /optimizer@optimizer: adamw
  - /scheduler@scheduler: cosine_annealing_warmup
  - _self_

model:
  _target_: symdrift.model.TorchMDDynamics
  sphere_channels: 160
  max_radius: 11.0
  num_layers: 20
  num_distance_basis: 64
  rbf_type: expnorm
  trainable_rbf: true
  activation: silu
  neighbor_embedding: true
  max_z: 100
  node_attr_dim: 10
  edge_attr_dim: 1
  attn_activation: silu
  num_heads: 8
  distance_influence: both
  reduce_op: sum
  qk_norm: true
  clip_during_norm: true
  so3_equivariant: false
  output_layer_norm: true
  # used to switch parity of predictions (to correct chirality)
  parity_switch: post_hoc
  # dont use embedding for time conditioning
  use_noise_schedule_sigma_encoding: false

optimizer:
  betas: [0.95, 0.999]
  weight_decay: 1e-10

scheduler:
  gamma: 0.05

grad_norm_max_val: 100