# @package _global_

defaults:
  - drifting
  - override /dataset: geom_drugs
  - override /model: ditmc_airpe

run:
  experiment: geom_drugs

# DiTMC train wiht 1 GPU and bz 128 for 50 epochs
# DRUGS train size: 243_088 samples / (1*128) = 1900 steps/epoch 
# leading to 95_000 steps after 50 epochs
# they dont reduce, but warmup for 1% of the training --> 950 steps
model:

  # They used the L version for GEOM-DRUGS
  model:
    sphere_channels: 384
    num_layers: 8
    num_heads: 12
    mgn_num_layers: 3

  optimizer:
    lr: 1.0e-5
    weight_decay: 0.01

  scheduler:
    first_cycle_steps: 95_000 
    max_lr: 1.0e-4
    min_lr: 1.0e-5
    warmup_steps: 950

generative_model:
  sample_every_epoch: 25

  # Number of negative samples to use per positive sample
  n_neg_per_pos: 16

  # RMSD threshold to compute coverage and machting metrics
  threshold: 0.75

  # Ratio between conformers and generated samples to use for evaluation (if null, all conformers will be used)
  ratio: 2.0

dataset:
  batch_size: 128

trainer:
  max_epochs: 50
  devices: 1