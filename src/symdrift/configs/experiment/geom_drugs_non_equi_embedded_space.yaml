# @package _global_

defaults:
  - drifting
  - override /dataset: geom_drugs
  - override /model: ditmc_airpe

run:
  experiment: geom_drugs

# Train wiht 8 GPU and bz 4 for 100 epochs
# DRUGS train size: 243_088 samples / (8*32) = 7597 steps/epoch 
# One cycle is defined with 50 epochs --> 379_850 steps
# tWarmup for 1% of the training --> 3799 steps
model:

  # They used the L version for GEOM-DRUGS
  model:
    sphere_channels: 384
    num_layers: 8
    num_heads: 12
    mgn_num_layers: 3

  optimizer:
    lr: 1.0e-5
    weight_decay: 0.01

  scheduler:
    first_cycle_steps: 379_850 
    max_lr: 1.0e-4
    min_lr: 1.0e-6
    warmup_steps: 950
    cycle_mult: 1.0
    gamma: 0.1

generative_model:
  sample_every_epoch: 100

  # RMSD threshold to compute coverage and machting metrics
  threshold: 0.75

  # Ratio between conformers and generated samples to use for evaluation (if null, all conformers will be used)
  ratio: 2.0

dataset:
  batch_size: 4

trainer:
  max_epochs: 100
  devices: 8