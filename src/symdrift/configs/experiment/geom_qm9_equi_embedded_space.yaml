# @package _global_

defaults:
  - drifting
  - override /dataset: geom_qm9
  - override /model: torchmd

run:
  experiment: geom_qm9

model:
  # Taken from ETFLOW SI A.4
  optimizer:
    lr: 8.0e-4
    weight_decay: 0.0

  # Train wiht 2 GPUS and Nc=8 for 200 epochs and defined 1 batch as 1 conformer.
  # QM9 train size: 105902 graphs / (2*8) = 6619 steps/epoch.
  # One cycle is defined with 100 epochs --> 661_900 steps
  scheduler:
    first_cycle_steps: 661_900 
    max_lr: 8.0e-4
    min_lr: 1.0e-7

generative_model:
  sample_every_epoch: 200

  # RMSD threshold to compute coverage and machting metrics
  threshold: 0.5

  # Ratio between conformers and generated samples to use for evaluation (if null, all conformers will be used)
  ratio: 2.0

dataset:
  batch_size: 8

trainer:
  max_epochs: 200
  devices: 2
