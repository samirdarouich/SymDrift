# @package _global_

defaults:
  - geom_qm9_equi_embedded_space
  - override /model: ditmc_airpe

# Train wiht 1 GPU and bz 36 for 250 epochs
# QM9 train size: 106412 samples / (1*36) = 2942 steps/epoch 
# leading to 735_500 steps after 250 epochs.
# Warmup for 1% of the training --> 7355 steps
model:
  optimizer:
    lr: 1.0e-5
    weight_decay: 0.01

  scheduler:
    first_cycle_steps: 735_500 
    max_lr: 3.0e-4
    min_lr: 0.0
    warmup_steps: 7355

generative_model:
  sample_every_epoch: 250

  # RMSD threshold to compute coverage and machting metrics
  threshold: 0.5

  # Ratio between conformers and generated samples to use for evaluation (if null, all conformers will be used)
  ratio: 2.0

dataset:
  batch_size: 36

trainer:
  max_epochs: 250
  devices: 1