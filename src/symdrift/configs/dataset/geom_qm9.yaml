# Dataset configuration for GEOM QM9 dataset
# conformer uses the atomic-type embedding, whereas 
# 'graph_automorphism' uses the graph automorphism embedding
defaults:
  - /transforms@transforms: conformer
  - _self_

# Dataset specific parameters (assume data lies in the run folder under the dataset name e.g. data/geom_qm9 for the geom_qm9 dataset)
name: geom_qm9
root: ${run.work_dir}/data/${dataset.name}
identifier: smiles
split_identifier: geomol_cleaned

# Batch size defines the number of graphs from the dataset (can be seen as postive class)
# where each graph has n_conformers, which can be seen as positive samples.
batch_size: 2

# In the case of testing, we loop with 'test_batch_size' through the test set
# and generate 'x' samples per graph, where we subdivide the 'x' samples using
# 'batch_size' to avoid memory issues. 
test_batch_size: 1

# Dataloader parameters
num_workers: 4
persistent_workers: true
pin_memory: true

# Define datamodule for training
datamodule:
  _target_: symdrift.datasets.DataModule
  dataset:
    _target_: symdrift.datasets.ConformerDatasetInMemory
    root: ${dataset.root}
    source: ${dataset.name}
    identifier: ${dataset.identifier}
  split_identifier: ${dataset.split_identifier}
  train_transform: ${dataset.transforms.train_transform}
  val_transform: ${dataset.transforms.val_transform}
  test_transform: ${dataset.transforms.test_transform}
  train_batch_size: ${dataset.batch_size}
  val_batch_size: ${dataset.batch_size}
  test_batch_size: ${dataset.test_batch_size}
  num_workers: ${dataset.num_workers}
  pin_memory: ${dataset.pin_memory}
  persistent_workers: ${dataset.persistent_workers}
  follow_batch: ${dataset.transforms.follow_batch}
  exclude_keys: ${dataset.transforms.exclude_keys}
  shuffle_train: true
  drop_last_train: false

