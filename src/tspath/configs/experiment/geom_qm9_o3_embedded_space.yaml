# @package _global_

defaults:
  - drifting
  - override /dataset: geom_qm9
  - override /model: torchmd

run:
  experiment: geom_qm9

generative_model:
  sample_every_epoch: 100

  # RMSD threshold to compute coverage and machting metrics
  threshold: 0.5

# Taken from ETFLOW SI A.4
model.optimizer:
  lr: 8.0e-4
  weight_decay: 0.0

# ETFLOW train wiht 4 GPUS and bz 128 for 200 epochs 
# QM9 train size: 106412 samples / (4*128) = 208 steps/epoch 
# leading to 41_600 steps after 200 epochs
# they reduce after 100 epochs --> 20_800 steps
model.scheduler:
  first_cycle_steps: 20_800 
  max_lr: 8e-4
  min_lr: 1e-7

dataset:
  batch_size: 128

trainer:
  max_epochs: 1000
  devices: 4
