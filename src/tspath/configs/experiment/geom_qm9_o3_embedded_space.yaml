# @package _global_

defaults:
  - drifting
  - override /dataset: geom_qm9
  - override /model: torchmd

run:
  experiment: geom_qm9

model:
  # Taken from ETFLOW SI A.4
  optimizer:
    lr: 8.0e-4
    weight_decay: 0.0

  # ETFLOW train wiht 4 GPUS and bz 128 for 200 epochs 
  # QM9 train size: 105902 samples / (4*128) = 207 steps/epoch 
  # leading to 41_400 steps after 200 epochs
  # they reduce after 100 epochs --> 20_200 steps
  scheduler:
    first_cycle_steps: 20_200 
    max_lr: 8.0e-4
    min_lr: 1.0e-7

generative_model:
  sample_every_epoch: 20

  # RMSD threshold to compute coverage and machting metrics
  threshold: 0.5

dataset:
  batch_size: 128

trainer:
  max_epochs: 200
  devices: 4
