# @package _global_

defaults:
  - /dataset: null
  - /model: null
  - /prior: harmonic
  - /drifting_field: embedding_space
  - /embedder: distance
  - /callbacks: default

seed: 42

run:
  experiment: drifting_base
  id: ${uuid:1}
  path: ${run.work_dir}/runs
  work_dir: ${hydra:runtime.cwd}
  # if training should be continued from a checkpoint
  ckpt_path: null 

generative_model:
  _target_: tspath.trainer.DriftingMolecules
  
  # convert all OmegaConf lists to python lists (for better compatibility)
  _convert_: all 

  # Sample every n epochs
  sample_every_epoch: 100

  # The drifting field needs to invariant wrt to permutations, translations and rotations
  # (if using an equivariant model. This is either possible by aligning each y to each x
  # or by using an invariant embedder (sorted distances for example))
  drifting_field: ${drifting_field}

  # The prior sampler defines the distribution from which the initial samples are drawn before applying the drift.
  prior_sampler: ${prior}

  # optional embedder to transform the input data into a different space before applying the drift.
  embedder: ${embedder}

  # This will only use attractive drift
  only_pos_drift: false 

  # Number of negative samples to use per positive sample
  n_neg_per_pos: 32

  # Model and optimizer configuration
  model: ${model.model}
  optimizer: ${model.optimizer}
  scheduler: ${model.scheduler}

  # Identifier for writing ASE atoms
  identifier: ${dataset.identifier}

  # Folder to save generated samples during training (if none, samples will not be saved)
  save_folder: generated_samples

  # Maximum number of conformers to sample per graph during training/validation (if null, will be determined by the batch)
  max_num_conformers: 32
  
  # RMSD threshold to compute coverage and machting metrics
  threshold: null

  # Ratio between conformers and generated samples to use for evaluation (if null, all conformers will be used)
  ratio: null

  # Use RDKIT to compute the RMSD without considering hydrogens
  worker_fn_type: rmsd_rdkit_wo_h

  # Number of workers to evaluate the RMSD in parallel (if 0, no parallelization will be used)
  num_workers: 0
  
  # Maximum value for adaptive gradient clipping (compare EDM)
  grad_norm_max_val: ${model.grad_norm_max_val}

  # No of samples during evaluation
  no_of_samples: null

  # Path to pretrained model checkpoint for fine-tuning
  pretrained: null 

trainer:
  max_epochs: 1000
  strategy: auto
  accelerator: auto

loggers:
  wandb_logger:
    _target_: pytorch_lightning.loggers.WandbLogger
    save_dir: "."
    name: ${replace:${run.id}, "/", "_"}
    id: ${replace:${run.id}, "/", "_"}
    project: ${run.experiment}
    offline: false