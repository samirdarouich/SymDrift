# @package _global_

defaults:
  - geom_qm9_o3_coordinate_space
  - override /model: dit_naive

# Naive drift not respect any symmetry of the system. This works if the model 
# also does not respect any symmetry (naive DiT)
drifting_field:
  aligned: false
  permuted: false
  brute_force_permutations: false 

trainer:
  max_epochs: 1000