# @package _global_

defaults:
  - geom_qm9_o3_embedded_space
  - override /model: dit_naive

generative_model:
  sample_every_epoch: 25

model.optimizer:
  lr: 1.0e-5
  weight_decay: 0.01

# DiTMC train wiht 1 GPU and bz 128 for 250 epochs
# QM9 train size: 106412 samples / (1*128) = 832 steps/epoch 
# leading to 208_000 steps after 250 epochs
# they dont reduce, but warmup for 1% of the training --> 2080 steps
model.scheduler:
  first_cycle_steps: 208_000 
  max_lr: 3.0e-4
  min_lr: 0.0
  warmup_steps: 2080

trainer:
  max_epochs: 250
  devices: 1