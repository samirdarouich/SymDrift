
model:
  _target_: tspath.model.DiT
  sphere_channels: 256
  max_radius: 11.0
  num_layers: 6
  num_heads: 8
  activation_fn: silu

  radial_basis_bool: false
  num_radial_basis: 8

  # graph conditioning network
  mgn_activation_fn: silu
  mgn_num_features: 256
  mgn_num_layers: 2
  mgn_num_node_features: 10
  mgn_num_edge_features: 1

  # positional encoding and embedding options
  absolute_positional_embedding_bool: True
  relative_positional_embedding_bool: False
  act_dense_correct_bool: True
  embed_shortest_hops_bool: false

  # used to switch parity of predictions (to correct chirality)
  parity_switch: null # post_hoc 

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-5
  weight_decay: 1e-8

scheduler:
  _target_: tspath.model.CosineAnnealingWarmupRestarts
  _partial_: true
  first_cycle_steps: 250_000
  cycle_mult: 1.0
  max_lr: 3e-4
  min_lr: 1e-5
  warmup_steps: 0
  gamma: 0.05
  last_epoch: -1

gradient_clip_val: 1.0