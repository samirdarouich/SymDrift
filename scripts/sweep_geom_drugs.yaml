method: bayes
name: geom_qm9_embedded_space

metric:
  name: val/AMR-P_mean
  goal: minimize

parameters:

  model.scheduler.max_lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3
  
  model.scheduler.min_lr:
    distribution: log_uniform_values
    min: 1e-8
    max: 1e-6

  model.optimizer.weight_decay:
    distribution: log_uniform_values
    min: 1e-10
    max: 1e-2
  
  model.model.sphere_channels:
    values: [128, 160, 256]
  
  model.model.num_layers:
    values: [16, 18, 20, 22, 24]


# 12154 hyperopt training samples bz 2 on one GPU
# 2000 steps/epoch --> one cycle 21 epochs: 42_000 steps
command:
  - ${env}
  - tspath_train
  - experiment=geom_drugs_o3_embedded_space
  - run.id="geom_drugs/o3_embedded_space/sweep_${uuid:1}"
  - trainer.max_epochs=21
  - trainer.devices=1
  - dataset.batch_size=2
  - dataset.split_identifier=geomol_cleaned_hyperopt
  - dataset.root=${oc.env:TMP_DIR}/geom_drugs
  - model.scheduler.first_cycle_steps=42_000
  - generative_model.sample_every_epoch=10
  - generative_model.num_workers=${oc.env:NUM_WORKERS}
  - callbacks=sweep
  - trainer.limit_train_batches=2000
  - +trainer.limit_val_batches=100
  - ${args_no_hyphens}