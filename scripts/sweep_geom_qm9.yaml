method: bayes
name: geom_qm9_embedded_space

metric:
  name: val/AMR-P_mean
  goal: minimize

parameters:

  model.scheduler.max_lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3
  
  model.scheduler.min_lr:
    distribution: log_uniform_values
    min: 1e-8
    max: 1e-6

  model.optimizer.weight_decay:
    distribution: log_uniform_values
    min: 1e-10
    max: 1e-2
  
  model.model.sphere_channels:
    values: [128, 160, 256]
  
  model.model.num_layers:
    values: [16, 18, 20, 22, 24]


# 10590 hyperopt training samples bz 1 on one GPU
# 10590 / 4 == 2648 steps/epoch --> fixed to 100 steps/epoch, one cycle 25 epochs: 2500 steps
command:
  - ${env}
  - symdrift_train
  - experiment=geom_qm9_o3_embedded_space
  - run.id="geom_qm9/o3_embedded_space/sweep_${uuid:1}"
  - trainer.max_epochs=51
  - trainer.devices=1
  - +trainer.limit_train_batches=100
  - +trainer.limit_val_batches=1
  - dataset.split_identifier=geomol_cleaned_hyperopt
  - dataset.batch_size=1
  - generative_model.n_neg_per_pos=128
  - generative_model.sample_every_epoch=10
  - model.scheduler.first_cycle_steps=2500
  - callbacks=sweep
  - ${args_no_hyphens}