method: bayes
name: geom_qm9_embedded_space

metric:
  name: val/AMR-P_mean
  goal: minimize

parameters:

  model.scheduler.max_lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3
  
  model.scheduler.min_lr:
    distribution: log_uniform_values
    min: 1e-8
    max: 1e-6

  model.optimizer.weight_decay:
    distribution: log_uniform_values
    min: 1e-10
    max: 1e-2
  
  model.model.sphere_channels:
    values: [128, 160, 256]
  
  model.model.num_layers:
    values: [4, 6, 8, 10, 14, 18, 22]


# 10590 hyperopt training samples bz 4 on one GPU
# 10590 / 4 == 2648 steps/epoch --> one cycle 25 epochs: 66_200 steps
command:
  - ${env}
  - tspath_train
  - experiment=geom_qm9_o3_embedded_space
  - run.id="geom_qm9/o3_embedded_space/sweep_${uuid:1}"
  - trainer.max_epochs=51
  - trainer.devices=1
  - dataset.batch_size=4
  - dataset.split_identifier=geomol_cleaned_hyperopt
  - model.scheduler.first_cycle_steps=66_200
  - generative_model.sample_every_epoch=10
  - generative_model.num_workers=${oc.env:NUM_WORKERS}
  - callbacks=sweep
  - +trainer.limit_val_batches=100
  - ${args_no_hyphens}